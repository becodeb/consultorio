<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultorio</title>
<meta name="theme-color" content="#F4F7F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F7F9;
    --grid: rgba(40, 70, 110, .07);
    --surface: #FFFFFF;
    --ink: #1E2F45;
    --muted: #66768A;
    --line: #D6DFE7;
    --pencil: #F4C542;
    --pencil-ink: #3A2E05;
    --danger: #B3413A;
    --radius-row: 14px;
    --radius-btn: 999px;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Bricolage Grotesque", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141C26;
      --grid: rgba(160, 190, 225, .06);
      --surface: #1C2633;
      --ink: #E6ECF2;
      --muted: #93A2B4;
      --line: #2E3B4B;
      --pencil: #E9B930;
      --pencil-ink: #2A2103;
      --danger: #E07A72;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    font: 17px/1.5 var(--body);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  /* Tabs */
  nav.tabs {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 4px;
    padding: 12px 16px;
    max-width: 560px; margin: 0 auto;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  nav.tabs button {
    flex: 1; border: 0; background: none;
    padding: 10px 8px; border-radius: var(--radius-btn);
    font-family: var(--display); font-weight: 500; font-size: 17px;
    color: var(--muted);
  }
  nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }

  /* Period header (day / month) */
  .period {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 0 20px;
  }
  .period h1 {
    margin: 0; text-align: center;
    font: 700 26px/1.15 var(--display); letter-spacing: -.01em;
  }
  .period h1 small { display: block; font: 400 15px/1.4 var(--body); color: var(--muted); }
  .arrow {
    width: 44px; height: 44px; flex: none;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 50%; display: grid; place-items: center;
  }
  .arrow svg { width: 20px; height: 20px; }
  .today-link {
    display: block; margin: -12px auto 16px; border: 0; background: none;
    color: var(--muted); text-decoration: underline; font-size: 15px;
  }

  /* Rows */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-row); padding: 12px 14px;
  }
  .row .time {
    font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums;
    min-width: 3.2em; color: var(--muted);
  }
  .row .who { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; overflow-wrap: anywhere; }
  .row .sub { font-size: 15px; color: var(--muted); }
  .row .amount { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.row { width: 100%; text-align: left; }

  /* Attendance check: highlighter stroke when present */
  .check {
    width: 48px; height: 48px; flex: none;
    border-radius: 50%; border: 2px solid var(--line); background: transparent;
    display: grid; place-items: center;
    transition: background-color .15s, border-color .15s, transform .15s;
  }
  .check svg { width: 24px; height: 24px; opacity: 0; transition: opacity .15s; }
  .row.present .check { background: var(--pencil); border-color: var(--pencil); }
  .row.present .check svg { opacity: 1; }
  .row.present .check:active { transform: scale(.92); }
  .row.present .name {
    background: linear-gradient(transparent 58%, color-mix(in srgb, var(--pencil) 55%, transparent) 58%);
  }
  .row.present .time { color: var(--ink); }

  .day-total {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 20px 4px 0; color: var(--muted);
  }
  .day-total strong { font: 700 22px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }

  .extra { display: flex; gap: 8px; margin-top: 16px; }
  .extra select { flex: 1; min-width: 0; }

  /* Month total */
  .big {
    text-align: center; margin: 4px 0 24px;
  }
  .big .num {
    font: 700 clamp(44px, 13vw, 64px)/1 var(--display);
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    display: inline-block; padding: 0 .12em;
    background: linear-gradient(transparent 62%, color-mix(in srgb, var(--pencil) 70%, transparent) 62%);
  }
  .big .sub { color: var(--muted); margin-top: 8px; }

  /* Buttons & fields */
  .btn {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius-btn); padding: 11px 18px; font-weight: 700;
  }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.danger { background: none; border-color: transparent; color: var(--danger); padding-inline: 4px; }
  .dialog-actions .btn { white-space: nowrap; }
  .btn.wide { width: 100%; padding: 14px; }
  input, select {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%;
  }
  label { display: block; font-weight: 700; margin-bottom: 14px; }
  label > input { margin-top: 6px; font-weight: 400; }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  .empty .btn { margin-top: 14px; }

  details.archived { margin-top: 28px; color: var(--muted); }
  details.archived summary { cursor: pointer; padding: 6px 4px; }
  details.archived .list { margin-top: 8px; }

  .backup { display: flex; gap: 8px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }

  /* Dialog */
  dialog {
    border: 0; border-radius: 20px; padding: 0;
    width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(15, 25, 40, .45); }
  dialog form { padding: 22px 20px 20px; }
  dialog h2 { margin: 0 0 18px; font: 700 24px/1.2 var(--display); }
  .slots { display: grid; gap: 8px; margin: 6px 0 10px; }
  .slot { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 8px; }
  .slot .x { border: 0; background: none; font-size: 22px; color: var(--muted); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .remove { display: block; margin: 14px auto 0; }
  .field-title { font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: var(--radius-btn);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<nav class="tabs" role="tablist">
  <button role="tab" data-view="hoy">Hoy</button>
  <button role="tab" data-view="pacientes">Pacientes</button>
  <button role="tab" data-view="cuentas">Cuentas</button>
</nav>

<main class="wrap" id="app"></main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">Nuevo paciente</h2>
    <label>Nombre
      <input name="patientName" required autocomplete="off">
    </label>
    <label>Precio por sesión
      <input name="price" type="number" inputmode="numeric" min="0" step="1" required>
    </label>
    <div class="field-title">Horarios</div>
    <div class="slots" id="slots"></div>
    <button type="button" class="btn" id="add-slot">Agregar horario</button>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
    <button type="button" class="btn danger remove" id="remove">Dar de baja</button>
  </form>
</dialog>

<input type="file" id="import-file" accept="application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'consultorio.v1';
const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DAY_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const money = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
const PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const NEXT = PREV.replace('M15 5l-7 7 7 7', 'M9 5l7 7-7 7');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';

const app = document.getElementById('app');
const state = { view: 'hoy', day: startOfDay(new Date()), month: firstOfMonth(new Date()), editing: null };
let db = load();

/* ---------- storage ---------- */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.patients) && Array.isArray(data.sessions)) return data;
    }
  } catch {}
  return { patients: [], sessions: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('No se pudo guardar en este navegador'); }
}

/* ---------- helpers ---------- */
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function byName(a, b) { return a.name.localeCompare(b.name, 'es'); }
function patient(id) { return db.patients.find(p => p.id === id); }
function sessionOf(patientId, date) { return db.sessions.find(s => s.patientId === patientId && s.date === date); }
function scheduleText(p) {
  if (!p.schedule.length) return 'Sin horario';
  return [...p.schedule].sort(slotOrder).map(s => `${DAY_SHORT[s.day]} ${s.time}`).join(', ');
}
function slotOrder(a, b) {
  const da = (a.day + 6) % 7, dbb = (b.day + 6) % 7; // Monday first
  return da - dbb || a.time.localeCompare(b.time);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- views ---------- */
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  ({ hoy: renderHoy, pacientes: renderPacientes, cuentas: renderCuentas })[state.view]();
}

function renderHoy() {
  const d = state.day, date = iso(d), wd = d.getDay();
  const isToday = date === iso(new Date());
  const active = db.patients.filter(p => p.active);

  const rows = [];
  const seen = new Set();
  for (const p of active) {
    const slot = p.schedule.filter(s => s.day === wd).sort(slotOrder)[0];
    if (slot) { rows.push({ p, time: slot.time }); seen.add(p.id); }
  }
  // Sessions outside the usual schedule for this date
  for (const s of db.sessions.filter(s => s.date === date && !seen.has(s.patientId))) {
    const p = patient(s.patientId);
    if (p) { rows.push({ p, time: '' }); seen.add(p.id); }
  }
  rows.sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || byName(a.p, b.p));

  const daySessions = db.sessions.filter(s => s.date === date);
  const dayTotal = daySessions.reduce((t, s) => t + s.price, 0);
  const others = active.filter(p => !seen.has(p.id)).sort(byName);

  let html = `
    <div class="period">
      <button class="arrow" data-act="day" data-step="-1" aria-label="Día anterior">${PREV}</button>
      <h1>${DAYS[wd]} ${d.getDate()}<small>${MONTHS[d.getMonth()]} ${d.getFullYear()}</small></h1>
      <button class="arrow" data-act="day" data-step="1" aria-label="Día siguiente">${NEXT}</button>
    </div>
    ${isToday ? '' : '<button class="today-link" data-act="today">Volver a hoy</button>'}`;

  if (!db.patients.length) {
    html += `<div class="empty">Todavía no hay pacientes.<br>
      <button class="btn primary" data-act="new">Agregar paciente</button></div>`;
  } else {
    if (rows.length) {
      html += '<ul class="list">' + rows.map(({ p, time }) => {
        const s = sessionOf(p.id, date);
        return `<li class="row ${s ? 'present' : ''}">
          <span class="time">${time || '—'}</span>
          <span class="who"><span class="name">${esc(p.name)}</span>
            <div class="sub">${money.format(s ? s.price : p.price)}</div></span>
          <button class="check" data-act="toggle" data-id="${p.id}"
            aria-pressed="${!!s}" aria-label="${s ? 'Quitar presente de' : 'Marcar presente a'} ${esc(p.name)}">${CHECK}</button>
        </li>`;
      }).join('') + '</ul>';
    } else {
      html += '<div class="empty">Nadie tiene turno este día.</div>';
    }

    if (daySessions.length) {
      html += `<div class="day-total"><span>${daySessions.length} ${daySessions.length === 1 ? 'sesión' : 'sesiones'}</span>
        <strong>${money.format(dayTotal)}</strong></div>`;
    }

    if (others.length) {
      html += `<div class="extra">
        <select id="extra-patient" aria-label="Paciente fuera de horario">
          <option value="">Otro paciente…</option>
          ${others.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
        <button class="btn" data-act="extra">Sumar</button>
      </div>`;
    }
  }
  app.innerHTML = html;
}

function renderPacientes() {
  const active = db.patients.filter(p => p.active).sort(byName);
  const archived = db.patients.filter(p => !p.active).sort(byName);

  let html = `<div class="period" style="justify-content:center"><h1>Pacientes</h1></div>
    <button class="btn primary wide" data-act="new">Agregar paciente</button>
    <div style="height:16px"></div>`;

  if (active.length) {
    html += '<ul class="list">' + active.map(p => `<li>
      <button class="row" data-act="edit" data-id="${p.id}">
        <span class="who"><span class="name">${esc(p.name)}</span>
          <div class="sub">${scheduleText(p)}</div></span>
        <span class="amount">${money.format(p.price)}</span>
      </button></li>`).join('') + '</ul>';
  } else {
    html += '<div class="empty">Todavía no hay pacientes.</div>';
  }

  if (archived.length) {
    html += `<details class="archived"><summary>Dados de baja (${archived.length})</summary>
      <ul class="list">${archived.map(p => `<li class="row">
        <span class="who"><span class="name">${esc(p.name)}</span></span>
        <button class="btn" data-act="restore" data-id="${p.id}">Reactivar</button>
      </li>`).join('')}</ul></details>`;
  }

  html += `<div class="backup">
    <button class="btn ghost" data-act="export">Descargar copia</button>
    <button class="btn ghost" data-act="import">Cargar copia</button>
  </div>`;
  app.innerHTML = html;
}

function renderCuentas() {
  const m = state.month;
  const prefix = iso(m).slice(0, 7);
  const sessions = db.sessions.filter(s => s.date.startsWith(prefix));
  const total = sessions.reduce((t, s) => t + s.price, 0);

  const perPatient = new Map();
  for (const s of sessions) {
    const e = perPatient.get(s.patientId) || { days: [], total: 0 };
    e.days.push(Number(s.date.slice(8)));
    e.total += s.price;
    perPatient.set(s.patientId, e);
  }
  const rows = [...perPatient.entries()]
    .map(([id, e]) => ({ p: patient(id) || { name: 'Paciente eliminado' }, ...e }))
    .sort((a, b) => byName(a.p, b.p));

  let html = `
    <div class="period">
      <button class="arrow" data-act="month" data-step="-1" aria-label="Mes anterior">${PREV}</button>
      <h1 style="text-transform:capitalize">${MONTHS[m.getMonth()]}<small>${m.getFullYear()}</small></h1>
      <button class="arrow" data-act="month" data-step="1" aria-label="Mes siguiente">${NEXT}</button>
    </div>
    <div class="big"><span class="num">${money.format(total)}</span>
      <div class="sub">${sessions.length} ${sessions.length === 1 ? 'sesión' : 'sesiones'}</div></div>`;

  if (rows.length) {
    html += '<ul class="list">' + rows.map(r => `<li class="row">
      <span class="who"><span class="name">${esc(r.p.name)}</span>
        <div class="sub">${r.days.length} ${r.days.length === 1 ? 'sesión' : 'sesiones'}: ${r.days.sort((a, b) => a - b).join(', ')}</div></span>
      <span class="amount">${money.format(r.total)}</span>
    </li>`).join('') + '</ul>';
  } else {
    html += '<div class="empty">No hay sesiones este mes.</div>';
  }
  app.innerHTML = html;
}

/* ---------- editor ---------- */
const editor = document.getElementById('editor');
const form = document.getElementById('editor-form');
const slotsEl = document.getElementById('slots');

function slotRow(slot = { day: 1, time: '16:00' }) {
  const div = document.createElement('div');
  div.className = 'slot';
  div.innerHTML = `
    <select aria-label="Día">${[1, 2, 3, 4, 5, 6, 0].map(d =>
      `<option value="${d}" ${d === slot.day ? 'selected' : ''}>${DAYS[d]}</option>`).join('')}</select>
    <input type="time" value="${slot.time}" required aria-label="Hora">
    <button type="button" class="x" aria-label="Quitar horario">×</button>`;
  div.querySelector('.x').onclick = () => div.remove();
  slotsEl.append(div);
}

function openEditor(p) {
  state.editing = p ? p.id : null;
  document.getElementById('editor-title').textContent = p ? 'Editar paciente' : 'Nuevo paciente';
  form.elements.patientName.value = p ? p.name : '';
  form.elements.price.value = p ? p.price : '';
  slotsEl.innerHTML = '';
  (p ? p.schedule : [undefined]).forEach(s => slotRow(s));
  document.getElementById('remove').hidden = !p;
  editor.showModal();
  if (!p) form.elements.patientName.focus();
}

document.getElementById('add-slot').onclick = () => slotRow();
document.getElementById('cancel').onclick = () => editor.close();
document.getElementById('remove').onclick = () => {
  const p = patient(state.editing);
  if (!p) return;
  if (!confirm(`¿Dar de baja a ${p.name}? Sus sesiones quedan en las cuentas.`)) return;
  p.active = false; save(); editor.close(); render(); toast('Dado de baja');
};

form.addEventListener('submit', e => {
  e.preventDefault();
  const name = form.elements.patientName.value.trim();
  const price = Math.round(Number(form.elements.price.value));
  if (!name || !(price >= 0)) return;
  const schedule = [...slotsEl.querySelectorAll('.slot')]
    .map(r => ({ day: Number(r.querySelector('select').value), time: r.querySelector('input').value }))
    .filter(s => s.time);

  const existing = patient(state.editing);
  if (existing) Object.assign(existing, { name, price, schedule });
  else db.patients.push({ id: uid(), name, price, schedule, active: true });
  save(); editor.close(); render();
  toast(existing ? 'Cambios guardados' : 'Paciente agregado');
});

/* ---------- actions ---------- */
function markPresent(p, date) {
  db.sessions.push({ id: uid(), patientId: p.id, date, price: p.price });
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const date = iso(state.day);

  if (act === 'toggle') {
    const s = sessionOf(id, date);
    if (s) db.sessions = db.sessions.filter(x => x !== s);
    else markPresent(patient(id), date);
    save(); render();
  } else if (act === 'extra') {
    const p = patient(document.getElementById('extra-patient').value);
    if (!p) return;
    markPresent(p, date); save(); render();
  } else if (act === 'day') {
    state.day = new Date(state.day.getFullYear(), state.day.getMonth(), state.day.getDate() + Number(el.dataset.step));
    render();
  } else if (act === 'today') {
    state.day = startOfDay(new Date()); render();
  } else if (act === 'month') {
    state.month = new Date(state.month.getFullYear(), state.month.getMonth() + Number(el.dataset.step), 1);
    render();
  } else if (act === 'new') {
    openEditor(null);
  } else if (act === 'edit') {
    openEditor(patient(id));
  } else if (act === 'restore') {
    patient(id).active = true; save(); render(); toast('Paciente reactivado');
  } else if (act === 'export') {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `consultorio-${iso(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } else if (act === 'import') {
    document.getElementById('import-file').click();
  }
});

document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.patients) || !Array.isArray(data.sessions)) throw new Error();
    if (!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Seguir?')) return;
    db = data; save(); render(); toast('Copia cargada');
  } catch {
    toast('Ese archivo no es una copia válida');
  }
});

document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  state.view = b.dataset.view; render();
});

render();
</script>
</body>
</html>
