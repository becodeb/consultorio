<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultorio</title>
<meta name="theme-color" content="#F4F7F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=__V__">
</head>
<body>

<div id="auth-view" class="auth-view" hidden>
  <div class="auth-card">
    <h1 class="auth-title">Consultorio</h1>
    <form id="auth-form" novalidate>
      <label>Mail
        <input type="email" name="email" required autocomplete="email" inputmode="email">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password" minlength="8">
      </label>
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" class="btn primary wide" id="auth-submit">Entrar</button>
    </form>
    <button type="button" class="btn ghost wide" id="auth-toggle">¿No tenés cuenta? Creá una</button>
  </div>
</div>

<div id="sync-indicator" class="sync-indicator" role="status" hidden>Sin conexión, guardando al volver</div>

<nav class="tabs" role="tablist" hidden>
  <button role="tab" data-view="hoy">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg></span>
    <span class="tab-label">Hoy</span>
  </button>
  <button role="tab" data-view="semana">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><path d="M8 14v4M12 13v5M16 15v3"/></svg></span>
    <span class="tab-label">Semana</span>
  </button>
  <button role="tab" data-view="mes">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v11M15 10v11"/><path d="M8 3v4M16 3v4"/></svg></span>
    <span class="tab-label">Mes</span>
  </button>
  <button role="tab" data-view="pacientes">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="8.7" r="2.6"/><path d="M15.8 14.3c2.7.5 4.7 2.8 4.7 5.9"/></svg></span>
    <span class="tab-label">Pacientes</span>
  </button>
  <button role="tab" data-view="cuentas">
    <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.6 15c0 1.1 1.1 2 2.4 2s2.4-.8 2.4-1.9c0-2.6-4.8-1.3-4.8-3.9 0-1.1 1.1-1.9 2.4-1.9s2.4.8 2.4 1.9"/></svg></span>
    <span class="tab-label">Cuentas</span>
  </button>
</nav>

<main class="wrap" id="app" hidden></main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">Nuevo paciente</h2>
    <label>Nombre
      <input name="patientName" required autocomplete="off">
    </label>
    <label>Precio por sesión
      <input name="price" type="number" inputmode="numeric" min="0" step="1" required>
    </label>
    <button type="button" class="link-btn" id="price-change-toggle">Programar cambio</button>
    <label class="from-field" id="price-from-field" hidden>A partir de
      <input type="date" name="priceFrom">
    </label>
    <div id="price-upcoming" class="upcoming-list"></div>

    <div class="field-title">Horarios</div>
    <div class="slots" id="slots"></div>
    <button type="button" class="btn" id="add-slot">Agregar horario</button>
    <button type="button" class="link-btn" id="schedule-change-toggle">Programar cambio</button>
    <label class="from-field" id="schedule-from-field" hidden>A partir de
      <input type="date" name="scheduleFrom">
    </label>
    <div id="schedule-upcoming" class="upcoming-list"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
    <button type="button" class="btn danger remove" id="remove">Dar de baja</button>
  </form>
</dialog>

<dialog id="reschedule">
  <form method="dialog" id="reschedule-form">
    <h2>Reprogramar</h2>
    <p class="sub" id="reschedule-who"></p>
    <div class="dialog-actions" style="flex-direction:column;align-items:stretch;gap:10px;margin-top:0">
      <button type="button" class="btn wide" data-choice="once">Solo esta vez…</button>
      <button type="button" class="btn wide" style="color:var(--danger)" data-choice="cancel">Cancelar esta sesión</button>
      <button type="button" class="btn wide ghost" data-choice="fixed">Cambiar horario fijo</button>
    </div>
    <div id="reschedule-once-fields" hidden style="margin-top:16px">
      <label>Nueva fecha <input type="date" name="toDate"></label>
      <div class="field-title">Nueva hora</div>
      <div id="reschedule-time-picker"></div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="reschedule-cancel">Cerrar</button>
      <button type="submit" class="btn primary" id="reschedule-confirm" hidden>Confirmar</button>
    </div>
  </form>
</dialog>

<dialog id="accounts-sheet">
  <div class="sheet-inner">
    <h2 id="accounts-title"></h2>
    <div class="accounts-balance" id="accounts-balance"></div>
    <form id="payment-form">
      <label>Monto
        <input type="number" name="amount" inputmode="numeric" min="0" step="1" required>
      </label>
      <div class="quick-amounts" id="quick-amounts"></div>
      <label>Fecha <input type="date" name="date" required></label>
      <label>Nota (opcional) <input type="text" name="note" autocomplete="off"></label>
      <button type="submit" class="btn primary wide">Registrar pago</button>
    </form>
    <div id="accounts-history"></div>
    <div id="accounts-price-history"></div>
    <div id="accounts-schedule-history"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="accounts-close">Cerrar</button>
    </div>
  </div>
</dialog>

<dialog id="voice-sheet">
  <div class="voice-sheet-inner">
    <div class="voice-sheet-head">
      <h2>Asistente por voz</h2>
      <button type="button" id="voice-new-chat" class="voice-new-chat">Nueva conversación</button>
    </div>
    <div id="voice-chat" class="voice-chat" aria-live="polite"></div>
    <div id="voice-undo-slot"></div>
    <button type="button" id="voice-mic-btn" class="voice-mic" aria-label="Escuchar / detener"></button>
    <div id="voice-status" class="voice-status"></div>
    <div id="voice-transcript" class="voice-transcript" aria-live="polite"></div>
    <form id="voice-text-form">
      <label>Escribí lo que querés hacer
        <input type="text" id="voice-text-input" autocomplete="off" placeholder="hoy vino Martina">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="voice-close">Cerrar</button>
        <button type="submit" class="btn primary">Enviar</button>
      </div>
    </form>
  </div>
</dialog>

<button id="mic-fab" class="fab" aria-label="Asistente por voz" aria-haspopup="dialog" hidden></button>

<input type="file" id="import-file" accept="application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="app.js?v=__V__"></script>
</body>
</html>
